{% extends 'base.html' %}
{% block title %}My Profile{% endblock %}
{% block content %}
<h2>My Profile</h2>
<div class="card mt-4">
  <div class="card-body">
    <form action="{{ url_for('student_profile') }}" method="POST" enctype="multipart/form-data">
      <div class="mb-3">
        <label for="full_name" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="full_name" name="full_name" value="{{ student.full_name }}" required>
      </div>
      <div class="mb-3">
        <label for="phone" class="form-label">Phone</label>
        <input type="text" class="form-control" id="phone" name="phone" value="{{ student.phone }}">
      </div>
      <div class="mb-3">
        <label for="department" class="form-label">Department</label>
        <select class="form-select" id="department" name="department">
          <option value="" {% if not student.department %}selected{% endif %}>Select Department</option>
          <option value="CS" {% if student.department == 'CS' %}selected{% endif %}>CS</option>
          <option value="IT" {% if student.department == 'IT' %}selected{% endif %}>IT</option>
          <option value="ECE" {% if student.department == 'ECE' %}selected{% endif %}>ECE</option>
          <option value="EEE" {% if student.department == 'EEE' %}selected{% endif %}>EEE</option>
          <option value="MECH" {% if student.department == 'MECH' %}selected{% endif %}>MECH</option>
          <option value="CIVIL" {% if student.department == 'CIVIL' %}selected{% endif %}>CIVIL</option>
          <option value="OTHER" {% if student.department == 'OTHER' %}selected{% endif %}>OTHER</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="cgpa" class="form-label">CGPA</label>
        <input type="number" step="0.01" min="0" max="10" class="form-control" id="cgpa" name="cgpa" value="{{ student.cgpa }}">
      </div>
      <div class="mb-3">
        <label for="skills" class="form-label">Skills</label>
        <textarea class="form-control" id="skills" name="skills" rows="3" placeholder="e.g., Python, Java, SQL">{{ student.skills }}</textarea>
      </div>
      <div class="mb-3">
        <label for="resume" class="form-label">Resume Upload</label>
        <input class="form-control" type="file" id="resume" name="resume" accept=".pdf">
        {% if student.resume_filename %}
        <div class="mt-2">
          Current: <a href="{{ url_for('uploaded_file', filename=student.resume_filename) }}" target="_blank">{{ student.resume_filename }}</a>
        </div>
        {% endif %}
      </div>
      <button type="submit" class="btn btn-primary">Update Profile</button>
    </form>
  </div>
</div>
{% endblock %}
